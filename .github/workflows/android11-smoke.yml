name: Android 11 Installation Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '.github/workflows/android11-smoke.yml'

permissions:
  contents: read

jobs:
  android11-install:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Download exact public release APK and check SHA-256
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p apk
          gh release download v3.7.2-android11 --repo "$GITHUB_REPOSITORY" --pattern 'ThreadsEnhancer-3.7.2-Android11.apk' --dir apk
          echo "64e572b05b8e7274c5d2ee31f7f300098cb167689c614f7ea9c02d6b437c5ea5  apk/ThreadsEnhancer-3.7.2-Android11.apk" | sha256sum -c
      - name: Verify exact released APK signatures
        run: |
          set -euo pipefail
          APK=apk/ThreadsEnhancer-3.7.2-Android11.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BT/apksigner" verify --min-sdk-version 21 --verbose --print-certs "$APK" | tee signing-report.txt
          grep -F 'Verified using v1 scheme (JAR signing): true' signing-report.txt
          grep -F 'Verified using v2 scheme (APK Signature Scheme v2): true' signing-report.txt
      - name: Enable KVM acceleration when available
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; ls -l /dev/kvm; else echo "No /dev/kvm available"; fi
      - name: Install exact release APK and launch app on Android 11 (API 30)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 900
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -eux
            adb wait-for-device
            adb shell getprop ro.build.version.sdk | grep -Fx 30
            adb install -r apk/ThreadsEnhancer-3.7.2-Android11.apk
            adb shell pm path br.gov.bomsucesso.threadsdownloader.inlinepost
            adb shell am start -n br.gov.bomsucesso.threadsdownloader.inlinepost/br.gov.bomsucesso.threadsdownloader.MainActivity
            sleep 5
            adb shell dumpsys activity activities > android11-activities.txt
            grep -F br.gov.bomsucesso.threadsdownloader.inlinepost android11-activities.txt
            adb logcat -d -t 400 > android11-logcat.txt || true
      - name: Publish Android 11 smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Android11-install-smoke-evidence
          path: |
            signing-report.txt
            android11-activities.txt
            android11-logcat.txt
          if-no-files-found: ignore
