name: Build & Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Verify package and APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BT/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK"
          "$BT/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "name='br.gov.bomsucesso.threadsdownloader.inlinepost'" /tmp/apk-badging.txt
          grep -F "sdkVersion:'26'" /tmp/apk-badging.txt
          grep -F "br.gov.bomsucesso.threadsdownloader.MainActivity" /tmp/apk-badging.txt
          unzip -t "$APK" | tail -n 2
      - name: Publish test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsDownloader-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Publish installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsEnhancer-v3.7.0-inline-post-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
