name: Build & Test APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests and build
        run: gradle :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - name: Sign APK explicitly with legacy and modern Android schemes
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$BT/apksigner" sign --ks "$HOME/.android/debug.keystore" --ks-key-alias androiddebugkey --ks-pass pass:android --key-pass pass:android --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled false --out "${APK}.signed" "$APK"
          mv "${APK}.signed" "$APK"
      - name: Verify package and APK signature
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          BT=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)
          "$BT/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK" | tee /tmp/signature-report.txt
          grep -F "Verified using v1 scheme (JAR signing): true" /tmp/signature-report.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" /tmp/signature-report.txt
          "$BT/aapt" dump badging "$APK" | tee /tmp/apk-badging.txt
          grep -F "name='br.gov.bomsucesso.threadsdownloader.inlinepost'" /tmp/apk-badging.txt
          grep -F "sdkVersion:'26'" /tmp/apk-badging.txt
          grep -F "br.gov.bomsucesso.threadsdownloader.MainActivity" /tmp/apk-badging.txt
          unzip -t "$APK" | tail -n 2
      - name: Publish test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsDownloader-tests
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Publish installable APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ThreadsEnhancer-v3.7.2-android11-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
