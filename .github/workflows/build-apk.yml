name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, agent/build-apk ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # Mantém a mesma assinatura de debug entre as próximas compilações.
      # A primeira instalação 3.4.0 ainda exige remover a chave antiga; depois
      # disso, as atualizações poderão usar pm install -r enquanto o cache existir.
      - name: Restore signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: threads-enhancer-debug-keystore-v1

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: ThreadsDownloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
